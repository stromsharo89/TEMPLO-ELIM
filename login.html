<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - IEPJ</title>
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        .login-page { min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 30px;
            background: linear-gradient(rgba(8,28,50,.92), rgba(27,106,165,.88)), url("img/portada.jpg") center / cover; }
        .login-box { width: 100%; max-width: 430px; background: #fff; padding: 42px 38px; border-radius: 22px;
            border-top: 4px solid var(--oro); box-shadow: 0 24px 60px rgba(0,0,0,.28); }
        .login-logo { text-align: center; margin-bottom: 30px; }
        .login-logo i { font-size: 46px; color: var(--azul); margin-bottom: 10px; }
        .login-logo h1 { font-size: 28px; }
        .login-logo p { color: var(--suave); font-size: 15px; }
        .campo { margin-bottom: 20px; }
        .campo label { display: block; margin-bottom: 8px; color: var(--navy); font-weight: 700; font-size: 14px; }
        .input-box { position: relative; }
        .input-box i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--azul); }
        .input-box input { width: 100%; padding: 14px 15px 14px 45px; border: 1px solid #d5e0ea; border-radius: 10px; font: inherit; font-size: 15px; }
        .input-box input:focus { outline: none; border-color: var(--azul); box-shadow: 0 0 0 3px rgba(27,106,165,.15); }
        .btn-entrar { width: 100%; border: 0; padding: 14px; border-radius: 10px; background: var(--navy); color: #fff; font: inherit; font-size: 16px; font-weight: 700; cursor: pointer; transition: .25s; }
        .btn-entrar:hover { background: var(--azul); }
        .volver { display: block; text-align: center; margin-top: 22px; color: var(--azul); font-size: 14px; font-weight: 600; }
        .volver:hover { color: var(--navy); }
    </style>
</head>
<body>

<div class="login-page">
    <div class="login-box">
        <div class="login-logo">
            <i class="fa-solid fa-church"></i>
            <h1>Bienvenido</h1>
            <p>Ingresa al sistema de la iglesia</p>
        </div>
        <form id="formLogin">
            <div class="campo">
                <label for="loginCorreo">Correo electrónico</label>
                <div class="input-box">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" id="loginCorreo" placeholder="ejemplo@gmail.com" required>
                </div>
            </div>
            <div class="campo">
                <label for="password">Contraseña</label>
                <div class="input-box">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="password" placeholder="Ingresa tu contraseña" required>
                </div>
            </div>
            <button type="submit" class="btn-entrar">
                <i class="fa-solid fa-right-to-bracket"></i> Iniciar sesión
            </button>
        </form>
        <a href="index.html" class="volver">← Volver a la página principal</a>
    </div>
</div>

<script src="js/script.js"></script>
</body>
</html>
