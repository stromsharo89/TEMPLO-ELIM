<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso administrativo | TEMPLO ELIM</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="login-fondo">
    <main class="login-caja">
        <h1>TEMPLO ELIM</h1>
        <p>Panel privado de administración de la iglesia.</p>

        <form id="formLogin">
            <label for="correo">Correo electrónico</label>
            <input id="correo" type="email" autocomplete="username" required>

            <label for="password">Contraseña</label>
            <input id="password" type="password" autocomplete="current-password" required>

            <button class="boton" type="submit">Iniciar sesión</button>
        </form>

        <p id="mensajeLogin" class="mensaje" role="status"></p>
        <a href="index.html">Volver al inicio</a>
    </main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/login.js"></script>
</body>
</html>
